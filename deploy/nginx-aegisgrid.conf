# AegisGrid — nginx reverse proxy (VPS)
#
# Place in /etc/nginx/sites-available/aegisgrid
# Enable: ln -s /etc/nginx/sites-available/aegisgrid /etc/nginx/sites-enabled/
# Test:  nginx -t
# Reload: nginx -s reload
#
# Assumes:
#   - aegisgrid running on 127.0.0.1:3000 (docker or systemd)
#   - certbot installed for TLS

server {
    listen 80;
    server_name _;

    # Redirect all HTTP → HTTPS (uncomment once TLS is live)
    # return 301 https://$host$request_uri;

    # Remove this block once TLS is configured
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

